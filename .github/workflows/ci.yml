name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile source
        run: python -m compileall -q al_mehdi tests
      - name: Verify 100-agent invariant
        run: python scripts/verify_100_agents.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Run system doctor
        run: al-mehdi --db /tmp/al-mehdi-ci.db doctor

